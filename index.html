:root {

  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121417;
    --surface: #191c21;
    --text: #ebe9e4;
    --muted: #a7abb3;
    --line: #2e333b;
    --brand: #a9c2e6;
    --brand-text: #121417;
    --brass: #d4b06a;
    --logo-fg: #121417;
    --link: #a6c3f5;
    --soft: #1d2127;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.55 var(--sans); }
a { color: var(--link); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.hidden { display: none !important; }
ul.plain { list-style: none; margin: 0; padding: 0; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* Masthead */
header { padding: 22px 0 0; }
.masthead { display: flex; align-items: center; gap: 12px; }
.logo { width: 44px; height: 44px; flex: none; }
.logo .bg { fill: var(--brand); }
.logo .ring { fill: none; stroke: var(--brass); stroke-width: 1.2; }
.logo .amp { fill: var(--logo-fg); font: italic 26px Georgia, serif; }
.brand { margin: 0; font: 700 1.8rem/1.05 var(--serif); }
.brand a { color: var(--text); text-decoration: none; }
.brand em { font-weight: 400; color: var(--brass); }
.tagline { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
nav.top { display: flex; gap: 24px; margin-top: 14px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
nav.top a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 1rem; }
nav.top a[aria-current="page"] { color: var(--text); text-decoration: underline; text-decoration-color: var(--brass); text-decoration-thickness: 3px; text-underline-offset: 8px; }

/* Home: Craigslist-style index */
.index { columns: 3 260px; column-gap: 40px; margin-top: 22px; }
.block { break-inside: avoid; margin: 0 0 26px; }
.block h2 { margin: 0 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--brand); font: 700 1.15rem var(--serif); }
.block h2 a { color: var(--text); text-decoration: none; }
.block h2 a:hover { color: var(--link); text-decoration: underline; }
.block li { padding: 3px 0; }
.block li a { text-decoration: none; }
.block li a:hover { text-decoration: underline; }
.block .all { font-size: .92rem; font-weight: 700; }
.block .soon { color: var(--muted); font-size: .95rem; }

/* Category pages */
.crumb { display: inline-block; margin: 20px 0 4px; font-size: .95rem; font-weight: 600; text-decoration: none; }
.crumb:hover { text-decoration: underline; }
.page h1 { margin: 0 0 4px; font: 700 1.7rem var(--serif); }
.count { margin: 0 0 14px; color: var(--muted); }
.rows { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 700; font-size: 1.1rem; text-decoration: none; }
.row .name:hover { text-decoration: underline; }
.row .desc { margin: 2px 0 0; color: var(--muted); }
.row .note { margin: 4px 0 0; font-size: .95rem; }
.pick { margin-left: 6px; font: 700 .68rem var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--brass); border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; white-space: nowrap; vertical-align: 2px; }
.visit { flex: none; padding: 10px 18px; border-radius: 6px; background: var(--brand); color: var(--brand-text); font-weight: 700; text-decoration: none; }
.visit:hover { opacity: .88; }
.opening { opacity: .55; pointer-events: none; }
.newsletter { margin: 28px 0 0; padding: 18px; border: 1px solid var(--line); border-top: 3px solid var(--brass); border-radius: 8px; background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.newsletter .nl-text { flex: 1 1 260px; }
.newsletter h2 { margin: 0 0 4px; font: 700 1.15rem var(--serif); }
.newsletter p { margin: 0; color: var(--muted); }
.newsletter .visit { white-space: nowrap; }
.more-videos { margin: 18px 0 0; padding: 14px 16px; background: var(--soft); border-radius: 8px; }
.more-videos a { font-weight: 700; text-decoration: none; }
.more-videos a:hover { text-decoration: underline; }

/* Videos */
.play { width: 10px; height: 10px; margin-right: 8px; color: var(--brass); }
.vlist li { padding: 3px 0; }
.vlist a { text-decoration: none; }
.vlist a:hover { text-decoration: underline; }
.vrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
.vrow .name { font-weight: 700; font-size: 1.1rem; }
.topic { margin-bottom: 8px; }
.topic-label { margin: 0 0 4px; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

.channels-intro { margin: 18px 0 0; color: var(--muted); }
.channels a { font-weight: 600; text-decoration: none; white-space: nowrap; }
.channels a:hover { text-decoration: underline; }
.search-on { color: var(--muted); font-size: .95rem; }
footer a { color: var(--muted); }
.info p { max-width: 62ch; }
footer { margin-top: 40px; padding: 18px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
footer p { margin: 0 0 6px; max-width: 62ch; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="masthead">
      <svg class="logo" viewBox="0 0 46 46" aria-hidden="true">
        <rect class="bg" width="46" height="46" rx="10"/>
        <rect class="ring" x="4" y="4" width="38" height="38" rx="7"/>
        <text class="amp" x="23" y="32.5" text-anchor="middle">&amp;</text>
      </svg>
      <div>
        <p class="brand"><a href="#">Use <em>&amp;</em> Like</a></p>
        <p class="tagline">Hand-picked apps and tools, sorted by category.</p>
      </div>
    </div>
    <nav class="top" aria-label="Sections">
      <a href="#" id="nav-tools">Tools</a>
      <a href="#videos" id="nav-videos">Videos</a>
    </nav>
  </header>

  <main id="view"></main>
  <noscript><p>Please turn on JavaScript to see the directory.</p></noscript>

  <footer>
    <p>Some links on this page are affiliate links. If you sign up through them, we may earn a commission at no extra cost to you.</p>
    <p id="foot-channels"></p>
    <p><a href="#about">About</a> · <a href="#privacy">Privacy</a> · &copy; <span id="year"></span> useandlike.com</p>
  </footer>
</div>

<script>
(function () {
  var PLAY = '<svg class="play" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>';

  function slug(s) {
    return s.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // External link (affiliate or YouTube), honoring OPEN_IN_NEW_TAB.
  function ext(text, href, cls, rel) {
    var a = el("a", cls, text);
    a.href = href;
    if (OPEN_IN_NEW_TAB) {
      a.target = "_blank";
      rel = (rel + " noopener").trim();
    }
    if (rel) a.rel = rel;
    return a;
  }
  function inner(text, hash, cls) {
    var a = el("a", cls, text);
    a.href = "#" + hash;
    return a;
  }
  function aff(t, text, cls) { return ext(text, "/" + t.slug, cls, "sponsored"); }
  function channelUrl(c) { return "https://www.youtube.com/" + c.handle; }
  function channelSearchUrl(c, t) { return channelUrl(c) + "/search?query=" + encodeURIComponent(t.name); }
  // "How To Rocket · Guide Glimpse · …" as links; urlFor(channel) gives each link's address.
  function channelLinks(urlFor) {
    var span = el("span", "channels");
    CHANNELS.forEach(function (c, i) {
      if (i) span.appendChild(document.createTextNode(" · "));
      span.appendChild(ext(c.name, urlFor(c), null, ""));
    });
    return span;
  }
  function videoLink(v) {
    var a = ext(v.title, v.url, null, "");
    a.insertAdjacentHTML("afterbegin", PLAY);
    return a;
  }

  // Our pick first, then the rest in the order written above.
  function toolsIn(cat) {
    return TOOLS.filter(function (t) { return t.category === cat; })
      .sort(function (a, b) { return (b.isPick ? 1 : 0) - (a.isPick ? 1 : 0); });
  }
  function videosIn(cat) { return VIDEOS.filter(function (v) { return v.category === cat; }); }
  function videosFor(t) { return VIDEOS.filter(function (v) { return v.tool === t.name; }); }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  function newsletterBox() {
    var box = el("section", "newsletter");
    var t = el("div", "nl-text");
    t.appendChild(el("h2", null, NEWSLETTER.title));
    t.appendChild(el("p", null, NEWSLETTER.text));
    box.appendChild(t);
    var a = el("a", "visit", NEWSLETTER.button + " \u203a");
    a.href = "/newsletter";
    box.appendChild(a);
    return box;
  }

  // Home of a tab: every category with its first few tools (or videos).
  function renderIndex(view, videos) {
    if (videos) {
      var intro = el("p", "channels-intro", "Our channels: ");
      intro.appendChild(channelLinks(channelUrl));
      view.appendChild(intro);
    }
    var index = el("div", "index");
    CATEGORIES.forEach(function (cat) {
      var tools = toolsIn(cat);
      var block = el("section", "block");
      var h = el("h2");
      h.appendChild(inner(cat, (videos ? "videos-" : "") + slug(cat)));
      block.appendChild(h);
      var ul = el("ul", "plain");
      var total = tools.length;
      if (!tools.length) ul.appendChild(el("li", "soon", "Coming soon"));
      if (videos) {
        var vids = videosIn(cat);
        vids.slice(0, VISIBLE_COUNT).forEach(function (v) { var li = el("li"); li.appendChild(videoLink(v)); ul.appendChild(li); });
        if (!vids.length) tools.slice(0, VISIBLE_COUNT).forEach(function (t) {
          var li = el("li"); li.appendChild(inner(t.name, "videos-" + slug(cat))); ul.appendChild(li);
        });
        total = vids.length || tools.length;
      } else {
        tools.slice(0, VISIBLE_COUNT).forEach(function (t) { var li = el("li"); li.appendChild(aff(t, t.name)); ul.appendChild(li); });
      }
      if (total > VISIBLE_COUNT) {
        var li = el("li");
        li.appendChild(inner("All " + total + " ›", (videos ? "videos-" : "") + slug(cat), "all"));
        ul.appendChild(li);
      }
      block.appendChild(ul);
      index.appendChild(block);
    });
    view.appendChild(index);
    if (!videos && NEWSLETTER.ready) view.appendChild(newsletterBox());
  }

  // One category in the Tools tab: every tool with a description and a Visit button.
  function renderCategory(view, cat) {
    var tools = toolsIn(cat);
    view.appendChild(inner("‹ All categories", "", "crumb"));
    view.appendChild(el("h1", null, cat));
    view.appendChild(el("p", "count", tools.length ? plural(tools.length, "tool") : "Coming soon"));
    var ul = el("ul", "plain rows");
    tools.forEach(function (t) {
      var li = el("li", "row");
      var main = el("div", "main");
      main.appendChild(aff(t, t.name, "name"));
      if (t.isPick) main.appendChild(el("span", "pick", "Our pick"));
      main.appendChild(el("p", "desc", t.description));
      if (t.why) main.appendChild(el("p", "note", t.why));
      if (t.details) main.appendChild(el("p", "note", t.details));
      li.appendChild(main);
      var visit = aff(t, "Visit", "visit");
      visit.setAttribute("aria-label", "Visit " + t.name);
      li.appendChild(visit);
      ul.appendChild(li);
    });
    view.appendChild(ul);
    if (tools.length) {
      var box = el("p", "more-videos");
      box.appendChild(document.createTextNode("Want to know more? "));
      box.appendChild(inner("Watch our videos about " + cat + " ›", "videos-" + slug(cat)));
      view.appendChild(box);
    }
    if (NEWSLETTER.ready) view.appendChild(newsletterBox());
  }

  // One category in the Videos tab: general videos, then each tool's videos and a channel search.
  function renderVideoCategory(view, cat) {
    var tools = toolsIn(cat);
    view.appendChild(inner("‹ All videos", "videos", "crumb"));
    view.appendChild(el("h1", null, cat + " videos"));
    var n = videosIn(cat).length;
    view.appendChild(el("p", "count", n ? plural(n, "video") : "Search our channels for each tool"));
    var topic = VIDEOS.filter(function (v) { return v.category === cat && !v.tool; });
    if (topic.length) {
      var box = el("div", "topic");
      box.appendChild(el("p", "topic-label", "On this topic"));
      var tl = el("ul", "plain vlist");
      topic.forEach(function (v) { var li = el("li"); li.appendChild(videoLink(v)); tl.appendChild(li); });
      box.appendChild(tl);
      view.appendChild(box);
    }
    var ul = el("ul", "plain rows");
    tools.forEach(function (t) {
      var li = el("li", "vrow");
      li.appendChild(el("div", "name", t.name));
      var vl = el("ul", "plain vlist");
      videosFor(t).forEach(function (v) { var i = el("li"); i.appendChild(videoLink(v)); vl.appendChild(i); });
      var s = el("li");
      s.className = "search-on";
      s.insertAdjacentHTML("afterbegin", PLAY);
      s.appendChild(document.createTextNode("Search on: "));
      s.appendChild(channelLinks(function (c) { return channelSearchUrl(c, t); }));
      vl.appendChild(s);
      li.appendChild(vl);
      ul.appendChild(li);
    });
    view.appendChild(ul);
  }

  // Small text pages, linked from the footer.
  var INFO = {
    about: {
      title: "About Use & Like",
      paragraphs: [
        "Use & Like is a directory of apps and tools, put together by the team behind the YouTube channels How To Rocket, Guide Glimpse and Logic Protocol.",
        "We make tutorials for many of these tools. This site collects them in one place, sorted by category, so you can find the right one quickly.",
        "Some links are affiliate links: if you sign up through them, we may earn a commission at no extra cost to you."
      ],
      channels: true
    },
    privacy: {
      title: "Privacy",
      paragraphs: [
        "This site does not use cookies, analytics or tracking scripts, and it does not ask for any personal data.",
        "The site is hosted by Cloudflare, which processes technical data such as your IP address to deliver the pages and protect them against abuse.",
        "When you click a tool or video link, you leave this site. The tool's website, its affiliate partner or YouTube may then set their own cookies, and their privacy policies apply.",
        "Last updated: 3 October 2026."
      ]
    }
  };
  function renderInfo(view, page) {
    view.appendChild(inner("‹ All categories", "", "crumb"));
    view.appendChild(el("h1", null, page.title));
    page.paragraphs.forEach(function (text) { view.appendChild(el("p", null, text)); });
    if (page.channels) {
      var p = el("p", null, "Questions? Reach us through our channels: ");
      p.appendChild(channelLinks(channelUrl));
      view.appendChild(p);
    }
  }

  // Pages live in the address after "#": "" home, "email" a category, "videos", "videos-email",
  // "about", "privacy".
  // Category links keep working in YouTube descriptions, and the back button returns to the list.
  var view = document.getElementById("view");
  var homeScroll = 0, lastRoute = null;
  function setCurrent(navId, on) {
    var a = document.getElementById(navId);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  function findCat(id) { return CATEGORIES.filter(function (c) { return slug(c) === id; })[0]; }

  function route() {
    var id = decodeURIComponent(location.hash.slice(1));
    var isVideos = id === "videos" || id.indexOf("videos-") === 0;
    var cat = findCat(isVideos ? id.slice(7) : id);
    var info = INFO.hasOwnProperty(id) ? INFO[id] : null;
    if (lastRoute === "" || lastRoute === "videos") homeScroll = window.scrollY;

    view.textContent = "";
    view.className = cat ? "page" : (info ? "page info" : "");
    if (info) renderInfo(view, info);
    else if (isVideos && cat) renderVideoCategory(view, cat);
    else if (isVideos) renderIndex(view, true);
    else if (cat) renderCategory(view, cat);
    else renderIndex(view, false);

    setCurrent("nav-tools", !isVideos && !info);
    setCurrent("nav-videos", isVideos);
    document.title = info ? info.title + " – Use & Like"
      : cat ? cat + (isVideos ? " videos" : "") + " – Use & Like" : "Use & Like – Directory of apps and tools we use";

    // Coming back from a category page to its list returns to the same spot.
    var cameFromCategory = lastRoute !== null && lastRoute !== "" && lastRoute !== "videos";
    var isList = !cat && !info;
    window.scrollTo(0, isList && cameFromCategory ? homeScroll : 0);
    lastRoute = isList ? (isVideos ? "videos" : "") : id;
  }
  window.addEventListener("hashchange", route);

  // Affiliate sites can take a few seconds to open (their tracking redirects), so show at once that
  // the tap worked. Reset when coming back with the back button (the browser may restore this state).
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[rel~="sponsored"]');
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || a.target === "_blank") return;
    if (a.classList.contains("visit")) { a.dataset.label = a.textContent; a.textContent = "Opening\u2026"; }
    a.classList.add("opening");
  });
  window.addEventListener("pageshow", function () {
    document.querySelectorAll(".opening").forEach(function (a) {
      a.classList.remove("opening");
      if (a.dataset.label) a.textContent = a.dataset.label;
    });
  });
  route();

  var footChannels = document.getElementById("foot-channels");
  footChannels.appendChild(document.createTextNode("Our YouTube channels: "));
  footChannels.appendChild(channelLinks(channelUrl));
  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
</body>
</html>

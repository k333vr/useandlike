<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use and Like – Directory of apps and tools we use</title>
<meta name="description" content="A directory of the apps and tools we use, sorted by category.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23222'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">

<script>
/* =====================================================================
   EDIT HERE — everything you normally need to change is in this block.
   ===================================================================== */

/* Where "Watch our video" goes. The tool name is added to the end.
   To search only your own channel, use something like:
   "https://www.youtube.com/@YOURCHANNEL/search?query="              */
const CHANNEL_SEARCH_URL = "https://www.youtube.com/results?search_query=";

/* false = links open in the same tab (back button returns to this page; better on phones).
   true  = links open in a new tab. */
const OPEN_IN_NEW_TAB = false;

/* How many tools each category shows before the "Show all" button. */
const VISIBLE_COUNT = 4;

/* Category order on the homepage. A category with no tools shows "Coming soon". */
const CATEGORIES = [
  "VPN & Privacy",
  "Email",
  "Cloud Storage",
  "Web Hosting",
  "Online Stores & Funnels"
];

/* All tools. "slug" is the short link: slug "hostinger" -> useandlike.com/hostinger.
   The real affiliate links live in the _redirects file, next to this one.
   isPick: true shows the "Our pick" label (use it on one tool per category). */
const TOOLS = [
  // VPN & Privacy
  { name: "Proton VPN",  category: "VPN & Privacy", description: "VPN service",
    why: "We use it to encrypt our connection, especially on public Wi-Fi.",
    slug: "protonvpn", isPick: true },
  { name: "Proton Pass", category: "VPN & Privacy", description: "Password manager",
    why: "We use it to store and fill our passwords across devices.",
    slug: "protonpass", isPick: false },

  // Email
  { name: "Proton Mail", category: "Email", description: "Encrypted email",
    why: "We use it as our main email account.",
    slug: "protonmail", isPick: true },
  { name: "StartMail",   category: "Email", description: "Private email service",
    why: "A privacy-focused email option we have tried.",
    slug: "startmail", isPick: false },

  // Cloud Storage
  { name: "pCloud",      category: "Cloud Storage", description: "Cloud storage",
    why: "We use it to store and sync files between our devices.",
    slug: "pcloud", isPick: true },
  { name: "Proton Drive", category: "Cloud Storage", description: "Encrypted cloud storage",
    why: "Cloud storage from the same company as Proton Mail.",
    slug: "protondrive", isPick: false },

  // Web Hosting
  { name: "Hostinger",   category: "Web Hosting", description: "Web hosting",
    why: "We use it to host websites.",
    slug: "hostinger", isPick: true },
  { name: "HostGator",   category: "Web Hosting", description: "Web hosting",
    why: "A web hosting option we have looked at.",
    slug: "hostgator", isPick: false },
  { name: "IONOS",       category: "Web Hosting", description: "Web hosting and domains",
    why: "A web hosting and domain option we have looked at.",
    slug: "ionos", isPick: false },
  { name: "WebHostMost", category: "Web Hosting", description: "Web hosting",
    why: "A web hosting option we have looked at.",
    slug: "webhostmost", isPick: false }

  // Online Stores & Funnels — add tools here, e.g.:
  // { name: "TOOL", category: "Online Stores & Funnels", description: "...",
  //   why: "...", slug: "tool", isPick: true },
];
/* ===================== END OF EDIT BLOCK ===================== */
</script>

<style>
:root {
  --bg: #fbfaf7;
  --surface: #ffffff;
  --text: #1d1c1a;
  --muted: #64615b;
  --line: #e4e0d8;
  --line-strong: #cfc9bd;
  --link: #1a4fa8;
  --hover: #f3f1ec;
  --btn-bg: #1d1c1a;
  --btn-text: #ffffff;
  --pick: #6b4e16;
  --pick-line: #d8c49a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414;
    --surface: #1b1b1b;
    --text: #e8e6e1;
    --muted: #a19d95;
    --line: #2b2a28;
    --line-strong: #3d3b37;
    --link: #93b4f5;
    --hover: #202020;
    --btn-bg: #e8e6e1;
    --btn-text: #141414;
    --pick: #e3c98f;
    --pick-line: #5c4c2a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
a { color: var(--link); }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }

/* Masthead */
header { padding: 28px 0 20px; border-bottom: 3px double var(--line-strong); }
.brand { margin: 0; font: 700 1.9rem/1.1 var(--serif); letter-spacing: -0.01em; }
.brand a { color: inherit; text-decoration: none; }
.tagline { margin: 6px 0 0; color: var(--muted); }

/* Search */
.search { margin: 20px 0 8px; position: relative; }
.search input {
  width: 100%; padding: 12px 14px 12px 40px;
  font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px;
  -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.summary { margin: 0 0 16px; color: var(--muted); font-size: 0.875rem; }

/* Directory */
.directory, .results, .panel ul { list-style: none; margin: 0; padding: 0; }
.directory { display: grid; grid-template-columns: 1fr; gap: 0 32px; }
@media (min-width: 760px) {
  .directory { grid-template-columns: 1fr 1fr; }
  .cat.open { grid-column: 1 / -1; }
}
.cat { border-bottom: 1px solid var(--line); }
.cat-toggle {
  width: 100%; display: flex; align-items: baseline; gap: 10px;
  padding: 14px 2px; background: none; border: 0; color: inherit;
  font: 600 1.125rem/1.3 var(--serif); text-align: left; cursor: pointer;
}
.cat-toggle:hover .cat-name { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.cat-name { flex: 1; }
.cat-count { font: 0.85rem var(--sans); color: var(--muted); }
.chev { width: 10px; flex: none; color: var(--muted); transition: transform .15s; align-self: center; }
.cat-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

.panel { padding: 0 2px 14px; }
.tool { padding: 14px 0; border-top: 1px dotted var(--line-strong); }
.tool:first-child { border-top: 0; padding-top: 4px; }
.tool-main { min-width: 0; }
.tool-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.tool-name { font-weight: 650; font-size: 1.05rem; text-decoration: none; }
.tool-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.tool-desc { color: var(--muted); font-size: 0.95rem; }
.tool-cat { color: var(--muted); font-size: 0.8rem; }
.pick {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--pick); border: 1px solid var(--pick-line); border-radius: 3px; padding: 0 5px;
}
.why { margin: 4px 0 0; font-size: 0.95rem; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 16px; border-radius: 6px;
  font-size: 0.9rem; font-weight: 600; text-decoration: none; white-space: nowrap;
  border: 1px solid var(--btn-bg);
}
.btn-primary { background: var(--btn-bg); color: var(--btn-text); }
.btn-secondary { background: transparent; color: var(--text); border-color: var(--line-strong); }
.btn:hover { opacity: .85; }
@media (min-width: 560px) {
  .tool { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .actions { margin-top: 2px; flex: none; }
}
.show-all {
  margin-top: 4px; padding: 8px 0; background: none; border: 0;
  color: var(--link); font: 600 0.95rem var(--sans); cursor: pointer;
}
.show-all:hover { text-decoration: underline; }
.empty { color: var(--muted); margin: 0; padding: 4px 0 6px; }

/* Search results */
.results .tool:first-child { border-top: 1px solid var(--line); padding-top: 14px; }
.results .tool:last-child { border-bottom: 1px solid var(--line); }
.no-results { color: var(--muted); padding: 12px 0; }

button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

footer { margin-top: 40px; padding: 20px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
footer p { margin: 0 0 8px; max-width: 60ch; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand"><a href="/">Use and Like</a></p>
    <p class="tagline">A directory of the apps and tools we use, sorted by category.</p>
  </header>

  <main>
    <div class="search" role="search">
      <label for="q" class="sr-only">Search tools</label>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search tools" autocomplete="off" enterkeyhint="search">
    </div>
    <p class="summary" id="summary" aria-live="polite"></p>

    <ul class="directory" id="directory" role="list"></ul>
    <ul class="results hidden" id="results" role="list"></ul>
    <p class="no-results hidden" id="no-results">No tools match your search.</p>
    <noscript><p>Please turn on JavaScript to see the directory.</p></noscript>
  </main>

  <footer>
    <p>Some links on this page are affiliate links. If you sign up through them, we may earn a commission at no extra cost to you.</p>
    <p>&copy; <span id="year"></span> useandlike.com</p>
  </footer>
</div>

<script>
(function () {
  function slug(s) {
    return s.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function link(text, href, cls, rel) {
    var a = el("a", cls, text);
    a.href = href;
    if (OPEN_IN_NEW_TAB) {
      a.target = "_blank";
      rel = (rel + " noopener").trim();
    }
    if (rel) a.rel = rel;
    return a;
  }

  function renderTool(t, showCategory) {
    var li = el("li", "tool");
    var main = el("div", "tool-main");
    var head = el("div", "tool-head");
    head.appendChild(link(t.name, "/" + t.slug, "tool-name", "sponsored"));
    if (t.isPick) head.appendChild(el("span", "pick", "Our pick"));
    head.appendChild(el("span", "tool-desc", t.description));
    main.appendChild(head);
    if (showCategory) main.appendChild(el("div", "tool-cat", t.category));
    main.appendChild(el("p", "why", t.why));
    li.appendChild(main);

    var actions = el("div", "actions");
    var visit = link("Visit", "/" + t.slug, "btn btn-primary", "sponsored");
    visit.setAttribute("aria-label", "Visit " + t.name);
    var watch = link("Watch our video", CHANNEL_SEARCH_URL + encodeURIComponent(t.name), "btn btn-secondary", "");
    watch.setAttribute("aria-label", "Watch our video about " + t.name);
    actions.appendChild(visit);
    actions.appendChild(watch);
    li.appendChild(actions);
    return li;
  }

  // Our pick first, then the rest in the order written above.
  function toolsIn(cat) {
    return TOOLS.filter(function (t) { return t.category === cat; })
      .sort(function (a, b) { return (b.isPick ? 1 : 0) - (a.isPick ? 1 : 0); });
  }

  var directory = document.getElementById("directory");
  var results = document.getElementById("results");
  var noResults = document.getElementById("no-results");
  var summary = document.getElementById("summary");
  var input = document.getElementById("q");

  var catCount = CATEGORIES.filter(function (c) { return toolsIn(c).length; }).length;
  var defaultSummary = TOOLS.length + " tools in " + catCount + (catCount === 1 ? " category" : " categories");
  summary.textContent = defaultSummary;

  CATEGORIES.forEach(function (cat) {
    var id = slug(cat);
    var tools = toolsIn(cat);

    var li = el("li", "cat");
    li.id = id;

    var btn = el("button", "cat-toggle");
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", id + "-panel");
    btn.appendChild(el("span", "cat-name", cat));
    btn.appendChild(el("span", "cat-count", tools.length ? String(tools.length) : "Soon"));
    btn.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5L6.5 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    li.appendChild(btn);

    var panel = el("div", "panel hidden");
    panel.id = id + "-panel";

    if (!tools.length) {
      panel.appendChild(el("p", "empty", "Coming soon."));
    } else {
      var ul = el("ul");
      ul.setAttribute("role", "list");
      tools.forEach(function (t, i) {
        var item = renderTool(t, false);
        if (i >= VISIBLE_COUNT) item.classList.add("hidden", "extra");
        ul.appendChild(item);
      });
      panel.appendChild(ul);

      if (tools.length > VISIBLE_COUNT) {
        var more = el("button", "show-all", "Show all " + tools.length + " →");
        more.type = "button";
        more.addEventListener("click", function () {
          ul.querySelectorAll(".extra").forEach(function (x) { x.classList.remove("hidden"); });
          more.remove();
        });
        panel.appendChild(more);
      }
    }
    li.appendChild(panel);

    btn.addEventListener("click", function () {
      var open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!open));
      panel.classList.toggle("hidden", open);
      li.classList.toggle("open", !open);
      // Keep the address bar in sync so a category can be shared, e.g. useandlike.com/#email
      history.replaceState(null, "", open ? location.pathname + location.search : "#" + id);
    });

    directory.appendChild(li);
  });

  // Search across all tools by name, description, category and "why" line.
  input.addEventListener("input", function () {
    var q = input.value.trim().toLowerCase();
    results.textContent = "";
    if (!q) {
      directory.classList.remove("hidden");
      results.classList.add("hidden");
      noResults.classList.add("hidden");
      summary.textContent = defaultSummary;
      return;
    }
    var words = q.split(/\s+/);
    var hits = TOOLS.filter(function (t) {
      var hay = (t.name + " " + t.description + " " + t.category + " " + t.why).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    });
    hits.forEach(function (t) { results.appendChild(renderTool(t, true)); });
    directory.classList.add("hidden");
    results.classList.toggle("hidden", !hits.length);
    noResults.classList.toggle("hidden", !!hits.length);
    summary.textContent = hits.length + (hits.length === 1 ? " result" : " results");
  });

  // Press "/" to jump to the search box (desktop).
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  });

  // Open a category directly from a link like useandlike.com/#web-hosting
  if (location.hash) {
    var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target && target.classList.contains("cat")) {
      target.querySelector(".cat-toggle").click();
      target.scrollIntoView();
    }
  }

  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
